<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account | J Flash Scholars</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="register">
<header class="site-header"><div class="wrap bar">
  <a class="brand" href="/"><img src="/img/logo-horizontal.png" alt="J Flash Scholars" width="139" height="44"></a>
  <nav class="nav" aria-label="Main"><a href="/">Home</a><span id="nav-auth" class="nav-auth"></span></nav>
</div></header>
<main>
<section class="band"><div class="wrap"><h1>Create your account</h1><p>One account lets you take the J Flash Scholars tests and see your scores.</p></div></section>
<div class="wrap pull"><div class="card narrow">
  <div id="msg" class="msg" role="status" hidden></div>
  <form id="form" novalidate>
    <div class="field"><label for="full_name">Full name</label><input id="full_name" name="full_name" type="text" autocomplete="name" required></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
      <p class="hint">We send a verification link here, so use an email you can open.</p></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <p class="hint">At least 8 characters.</p></div>
    <div class="field"><label for="password2">Repeat password</label><input id="password2" name="password2" type="password" autocomplete="new-password" required></div>
    <div class="field"><label for="phone">Phone number (optional)</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
    <div class="field"><label for="school">School or institution (optional)</label><input id="school" name="school" type="text" autocomplete="organization"></div>
    <div class="check"><input id="email_opt_in" name="email_opt_in" type="checkbox"><label for="email_opt_in">Send me J Flash Scholars updates and announcements by email.</label></div>
    <button id="submit" class="btn btn-block" type="submit">Create account</button>
  </form>
  <p class="links">Already registered? <a href="/login">Log in</a></p>
</div></div>
</main>
<footer class="footer"><div class="wrap">&copy; J Flash Scholars</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth-pages.js"></script>
</body>
</html>

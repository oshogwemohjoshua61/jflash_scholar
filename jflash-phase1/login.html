<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | J Flash Scholars</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="login">
<header class="site-header"><div class="wrap bar">
  <a class="brand" href="/"><img src="/img/logo-horizontal.png" alt="J Flash Scholars" width="139" height="44"></a>
  <nav class="nav" aria-label="Main"><a href="/">Home</a><span id="nav-auth" class="nav-auth"></span></nav>
</div></header>
<main>
<section class="band"><div class="wrap"><h1>Log in</h1><p>Welcome back. Log in to see your tests and scores.</p></div></section>
<div class="wrap pull"><div class="card narrow">
  <div id="msg" class="msg" role="status" hidden></div>
  <form id="form" novalidate>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button id="submit" class="btn btn-block" type="submit">Log in</button>
  </form>
  <p class="links"><a href="/reset">Forgot your password?</a><br>New here? <a href="/register">Create an account</a></p>
</div></div>
</main>
<footer class="footer"><div class="wrap">&copy; J Flash Scholars</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth-pages.js"></script>
</body>
</html>
